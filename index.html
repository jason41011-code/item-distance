<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 手臂 - 終極除錯版</title>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    <style>
        body { margin: 0; text-align: center; background-color: #222; color: white; font-family: sans-serif; }
        /* 這次我們把原始影片也顯示出來，加橘色框 */
        video { width: 100%; max-width: 400px; border: 3px solid #FF9800; background-color: #333; margin-bottom: 10px; }
        /* 這是處理後的畫面，加綠色框 */
        canvas { width: 100%; max-width: 400px; border: 3px solid #4CAF50; background-color: #000; }
        .panel { padding: 10px; }
        button { padding: 15px 30px; font-size: 20px; background-color: #2196F3; color: white; border: none; border-radius: 8px; font-weight: bold; margin: 10px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:disabled { background-color: #777; }
    </style>
</head>
<body>
    <h2>小白球測距 (雙畫面除錯版)</h2>
    
    <div class="panel">
        <p>狀態: <span id="status" style="color: #FFEB3B;">等待 OpenCV 載入...</span></p>
        <p style="font-size: 20px; color: #4CAF50;">距離: <span id="distance">-</span> cm</p>
        <p style="font-size: 12px; color: #F44336;" id="error-log"></p>
    </div>

    <button id="startBtn" disabled>等待系統準備...</button>
    <br>

    <p style="color: #FF9800; margin: 5px; font-size: 14px;">▼ 原始相機畫面 (橘框) ▼</p>
    <video id="videoInput" playsinline muted></video>
    
    <p style="color: #4CAF50; margin: 5px; font-size: 14px;">▼ AI 追蹤畫面 (綠框) ▼</p>
    <canvas id="canvasOutput"></canvas>

    <script>
        const KNOWN_WIDTH = 3.5; 
        let FOCAL_LENGTH = 500;  
        
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let startBtn = document.getElementById('startBtn');
        let errorLog = document.getElementById('error-log');
        let streaming = false;

        function onOpenCvReady() {
            document.getElementById('status').innerText = 'OpenCV 載入完成！請點擊啟動按鈕';
            startBtn.innerText = '📸 啟動相機';
            startBtn.disabled = false;
        }

        // 綁定按鈕點擊事件
        startBtn.addEventListener('click', () => {
            document.getElementById('status').innerText = '要求相機權限中...';
            startBtn.style.display = 'none'; // 按下後隱藏按鈕
            startCamera();
        });

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                // 每 500 毫秒檢查一次影片長寬，確保不是 0x0
                let checkDimensions = setInterval(() => {
                    if (video.videoWidth > 0 && video.videoHeight > 0) {
                        clearInterval(checkDimensions);
                        if (!streaming) {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            streaming = true;
                            document.getElementById('status').innerText = `系統運作中 (${video.videoWidth}x${video.videoHeight})`;
                            document.getElementById('status').style.color = '#4CAF50';
                            requestAnimationFrame(processVideo);
                        }
                    }
                }, 500);
            })
            .catch(function(err) {
                errorLog.innerText = "相機錯誤: " + err.message;
                document.getElementById('status').innerText = '無法存取相機';
            });
        }

        function processVideo() {
            if (!streaming) return;

            let src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            let cap = new cv.VideoCapture(video);
            
            try {
                cap.read(src);
            } catch (e) {
                errorLog.innerText = "讀取畫面失敗: " + e.message;
                src.delete();
                requestAnimationFrame(processVideo);
                return;
            }

            let hsv = new cv.Mat();
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

            // 白色追蹤設定
            let low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 0, 150, 0]);     
            let high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [180, 60, 255, 0]); 
            
            let mask = new cv.Mat();
            cv.inRange(hsv, low, high, mask);
            cv.GaussianBlur(mask, mask, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);

            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            if (contours.size() > 0) {
                let maxArea = 0;
                let maxContourIndex = -1;
                for (let i = 0; i < contours.size(); i++) {
                    let area = cv.contourArea(contours.get(i));
                    if (area > maxArea) {
                        maxArea = area;
                        maxContourIndex = i;
                    }
                }

                if (maxArea > 500) {
                    let circle = cv.minEnclosingCircle(contours.get(maxContourIndex));
                    let pixelWidth = circle.radius * 2;
                    let distance = (KNOWN_WIDTH * FOCAL_LENGTH) / pixelWidth;

                    document.getElementById('distance').innerText = distance.toFixed(1);
                    cv.circle(src, circle.center, circle.radius, [0, 255, 255, 255], 3);
                    cv.circle(src, circle.center, 2, [255, 0, 0, 255], 3);
                    cv.putText(src, distance.toFixed(1) + "cm", new cv.Point(circle.center.x, circle.center.y - circle.radius - 10), cv.FONT_HERSHEY_SIMPLEX, 0.8, [0, 255, 255, 255], 2);
                }
            }

            cv.imshow('canvasOutput', src);

            src.delete(); hsv.delete(); low.delete(); high.delete(); mask.delete(); contours.delete(); hierarchy.delete();

            requestAnimationFrame(processVideo);
        }
    </script>
</body>
</html>
