<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 小白球測距系統 - 極速原生版</title>
    <style>
        body { 
            margin: 0; 
            text-align: center; 
            background-color: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .panel { 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 10px; 
            max-width: 600px; 
            margin: 0 auto 10px auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-weight: bold;
        }
        video { display: none; } 
        canvas { 
            width: 100%; 
            max-width: 600px; 
            border: 2px solid #4CAF50; 
            border-radius: 8px;
            background-color: #000; 
        }
    </style>
</head>
<body>
    <h2>35mm 小白球距離偵測 (原生版)</h2>
    <div class="panel">
        <p>系統狀態: <span id="status" style="color: #4CAF50;">準備就緒</span></p>
        <p style="font-size: 26px; color: #4CAF50; margin: 5px 0;">距離: <span id="distance">-</span> cm</p>
        <button id="startBtn" onclick="startCamera()">【點擊直接啟動相機】</button>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>

    <script>
        const KNOWN_WIDTH = 3.5; // 小白球直徑 3.5 公分
        let FOCAL_LENGTH = 500;  // 預設焦距常數
        
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d', { willReadFrequently: true });
        let streaming = false;

        function startCamera() {
            document.getElementById('status').innerText = '正在要求相機權限...';
            document.getElementById('startBtn').disabled = true;

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    if (!streaming) {
                        // 設定較低的工作解析度以確保手機運算流暢 (320x240)
                        canvas.width = 320;
                        canvas.height = 240;
                        streaming = true;
                        document.getElementById('startBtn').style.display = 'none';
                        document.getElementById('status').innerText = '偵測中...';
                        requestAnimationFrame(processVideo);
                    }
                });
            })
            .catch(function(err) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    video.addEventListener('loadedmetadata', () => {
                        if (!streaming) {
                            canvas.width = 320;
                            canvas.height = 240;
                            streaming = true;
                            document.getElementById('startBtn').style.display = 'none';
                            document.getElementById('status').innerText = '偵測中 (預設鏡頭)';
                            requestAnimationFrame(processVideo);
                        }
                    });
                })
                .catch(function(e) {
                    document.getElementById('status').innerText = '相機失敗: ' + e.message;
                    document.getElementById('startBtn').disabled = false;
                });
            });
        }

        function processVideo() {
            if (!streaming) return;

            // 1. 將視訊畫格畫到 Canvas 上
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = frame.data;

            let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
            let whitePixelCount = 0;

            // 2. 掃描畫面尋找「白色且高亮度」的像素 (小白球)
            // 為了效能，每隔 2 個像素取樣一次
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    let idx = (y * canvas.width + x) * 4;
                    let r = data[idx];
                    let g = data[idx + 1];
                    let b = data[idx + 2];

                    // 白色的定義：R, G, B 數值都很高且相近（高亮度、低色彩飽和度）
                    if (r > 200 && g > 200 && b > 200 && Math.abs(r - g) < 20 && Math.abs(g - b) < 20) {
                        whitePixelCount++;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            // 3. 如果找到足夠數量的白色像素，計算邊界與距離
            if (whitePixelCount > 100) {
                let pixelWidth = maxX - minX;
                let pixelHeight = maxY - minY;
                let avgSize = (pixelWidth + pixelHeight) / 2;

                if (avgSize > 10) {
                    let distance = (KNOWN_WIDTH * FOCAL_LENGTH) / avgSize;
                    document.getElementById('distance').innerText = distance.toFixed(1);

                    // 在畫面上畫出追蹤框與中心點
                    let centerX = (minX + maxX) / 2;
                    let centerY = (minY + maxY) / 2;
                    let radius = avgSize / 2;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#00FFFF';
                    ctx.stroke();

                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(centerX - 2, centerY - 2, 4, 4);
                } else {
                    document.getElementById('distance').innerText = "-";
                }
            } else {
                document.getElementById('distance').innerText = "-";
            }

            requestAnimationFrame(processVideo);
        }
    </script>
</body>
</html>
