<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>35mm 白球精準追蹤與測距</title>
    <style>
        body { 
            margin: 0; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .box { 
            background: #222; 
            padding: 15px; 
            border-radius: 10px; 
            max-width: 600px; 
            margin: 0 auto 10px auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        canvas { 
            width: 100%; 
            max-width: 600px; 
            border: 2px solid #4CAF50; 
            border-radius: 8px; 
            background-color: #000; 
        }
        video { display: none; }
        .info { font-size: 24px; color: #ffeb3b; margin: 5px 0; }
        .debug { font-family: monospace; font-size: 13px; color: #00e676; background: #000; padding: 8px; border-radius: 5px; margin-top: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2>35mm 白球精準調校版</h2>
    <div class="box">
        <button id="startBtn" onclick="initCamera()">【 點擊啟動相機與追蹤 】</button>
        <div class="info">距離: <span id="distance">-</span> cm</div>
        <div class="debug" id="debugInfo">
            狀態: 尚未啟動相機
        </div>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>

    <script>
        // === 物理與光學參數 ===
        const KNOWN_WIDTH = 3.5; // 小白球真實直徑 3.5 公分
        let FOCAL_LENGTH = 300;  // 焦距常數 (稍後可透過實測 30cm 調整)
        
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isRunning = false;

        function logDebug(msg) {
            document.getElementById('debugInfo').innerHTML = msg;
        }

        function initCamera() {
            logDebug("狀態: 正在要求相機權限...");
            
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = 320;
                    canvas.height = 240;
                    isRunning = true;
                    
                    document.getElementById('startBtn').style.display = 'none';
                    logDebug("狀態: 相機啟動成功！正在掃描畫面中的白球...");
                    requestAnimationFrame(processFrame);
                });
            })
            .catch(function(err) {
                logDebug("錯誤: 無法啟動相機 -> " + err.message);
            });
        }

        function processFrame() {
            if (!isRunning) return;

            // 將視訊畫格畫到 Canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let pixels = frameData.data;

            let minX = canvas.width, maxX = 0;
            let minY = canvas.height, maxY = 0;
            let whitePixelCount = 0;

            // 為了效能，每隔 2 個像素掃描一次
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    let idx = (y * canvas.width + x) * 4;
                    let r = pixels[idx];
                    let g = pixels[idx + 1];
                    let b = pixels[idx + 2];

                    let maxVal = Math.max(r, g, b);
                    let minVal = Math.min(r, g, b);
                    let diff = maxVal - minVal;
                    let brightness = (r + g + b) / 3;

                    // 🛠️ 寬容度更高的白色/高光判定：
                    // 1. 平均亮度大於 110 (即使有一點陰影也能抓到)
                    // 2. R, G, B 的數值差小於 40 (代表它是無色彩的白、灰、高光，而不是紅藍綠色塊)
                    if (brightness > 110 && diff < 40) {
                        whitePixelCount++;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            let distElem = document.getElementById('distance');

            // 如果畫面上出現了足夠的白色像素群
            if (whitePixelCount > 30) {
                let pixelWidth = maxX - minX;
                let pixelHeight = maxY - minY;
                let avgSize = (pixelWidth + pixelHeight) / 2;

                // 限制抓取的大小範圍（避免把整面白牆或反光當成球）
                if (avgSize > 8 && avgSize < 200) {
                    let distance = (KNOWN_WIDTH * FOCAL_LENGTH) / avgSize;
                    distElem.innerText = distance.toFixed(1);

                    logDebug(`🎯 成功鎖定目標！<br>` +
                             `- 白色像素點數: ${whitePixelCount}<br>` +
                             `- 物體像素寬度: ${pixelWidth} px<br>` +
                             `- 當前計算距離: ${distance.toFixed(1)} cm`);

                    // 在畫面上畫出綠色追蹤方框
                    ctx.beginPath();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#00FF00';
                    ctx.rect(minX, minY, pixelWidth, pixelHeight);
                    ctx.stroke();

                    // 畫出中心紅點
                    let cx = (minX + maxX) / 2;
                    let cy = (minY + maxY) / 2;
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(cx - 3, cy - 3, 6, 6);

                } else {
                    distElem.innerText = "-";
                    logDebug(`⚠️ 偵測到白色區域，但尺寸不符 (過大或過小)<br>` +
                             `- 偵測到的像素寬度: ${pixelWidth} px (需介於 8~200 之間)<br>` +
                             `- 當前白色像素點數: ${whitePixelCount}`);
                }
            } else {
                distElem.innerText = "-";
                logDebug(`🔍 尋找白球中...<br>` +
                         `- 當前畫面中的白色像素數: ${whitePixelCount} (低於 30)<br>` +
                         `- 💡 提示: 請將 35mm 小白球靠近鏡頭，或調整室內燈光`);
            }

            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
