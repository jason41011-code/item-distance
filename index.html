<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小白球測距 - 除錯診斷版</title>
    <style>
        body { 
            margin: 0; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .box { 
            background: #222; 
            padding: 15px; 
            border-radius: 10px; 
            max-width: 600px; 
            margin: 0 auto 10px auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        button { 
            background-color: #ff5722; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        /* 讓視訊畫面直接顯示出來，方便你確認鏡頭有畫面 */
        video { 
            width: 100%; 
            max-width: 600px; 
            border: 2px solid #ff5722; 
            border-radius: 8px; 
            background-color: #000; 
        }
        canvas { display: none; }
        .debug-panel { 
            font-family: monospace; 
            background: #000; 
            color: #00e676; 
            text-align: left; 
            padding: 10px; 
            border-radius: 5px; 
            margin-top: 10px; 
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h2>小白球距離偵測 (除錯版)</h2>
    <div class="box">
        <button id="startBtn" onclick="initCamera()">【 點擊啟動相機與除錯 】</button>
        <p style="margin: 10px 0 5px 0;">計算距離: <span id="distance" style="font-size: 28px; color: #ffeb3b;">-</span> cm</p>
        
        <div class="debug-panel" id="debugLog">
            狀態: 尚未啟動相機
        </div>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>

    <script>
        const KNOWN_WIDTH = 3.5; // 小白球直徑 3.5 公分
        const FOCAL_LENGTH = 300; // 預設焦距基準
        
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isRunning = false;

        function log(msg) {
            document.getElementById('debugLog').innerHTML = msg;
        }

        function initCamera() {
            log("狀態: 正在向瀏覽器請求相機權限...");
            
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment' }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    // 設定一個極輕量的工作解析度，確保手機運算不延遲
                    canvas.width = 160;
                    canvas.height = 120;
                    isRunning = true;
                    
                    document.getElementById('startBtn').style.display = 'none';
                    log("狀態: 相機啟動成功！正在進行像素分析...");
                    requestAnimationFrame(processFrame);
                });
            })
            .catch(function(err) {
                log("錯誤: 無法啟動相機 -> " + err.message);
            });
        }

        function processFrame() {
            if (!isRunning) return;

            try {
                // 將視訊畫面畫進隱藏的 Canvas 裡以便抓取顏色資料
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let pixels = frameData.data;

                let whitePixelCount = 0;
                let minX = canvas.width, maxX = 0;

                // 迴圈掃描每一個像素，尋找白色（高亮度且 R, G, B 數值平均偏高）
                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        let idx = (y * canvas.width + x) * 4;
                        let r = pixels[idx];
                        let g = pixels[idx + 1];
                        let b = pixels[idx + 2];

                        // 白色的判斷條件：R, G, B 皆大於 200，且彼此數值差距小
                        if (r > 200 && g > 200 && b > 200 && Math.abs(r - g) < 15 && Math.abs(g - b) < 15) {
                            whitePixelCount++;
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                        }
                    }
                }

                let distElem = document.getElementById('distance');

                // 如果畫面中找到一定數量的白色像素
                if (whitePixelCount > 30) {
                    let pixelWidth = maxX - minX;
                    if (pixelWidth > 4) {
                        let distance = (KNOWN_WIDTH * FOCAL_LENGTH) / pixelWidth;
                        distElem.innerText = distance.toFixed(1);
                        log(`狀態: 🎯 成功抓取目標！<br>- 白色像素點數: ${whitePixelCount}<br>- 物體像素寬度: ${pixelWidth} px`);
                    } else {
                        distElem.innerText = "-";
                        log(`狀態: ⚠️ 偵測到白色但範圍太小<br>- 白色像素點數: ${whitePixelCount}`);
                    }
                } else {
                    distElem.innerText = "-";
                    log(`狀態: 🔍 尋找白色球體中...<br>- 當前畫面白色像素數: ${whitePixelCount} (請將白球靠近鏡頭)`);
                }

            } catch (e) {
                log("運行錯誤: " + e.message);
            }

            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
