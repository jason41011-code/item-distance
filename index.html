<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 物件辨識與測距系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <style>
        body { 
            margin: 0; 
            text-align: center; 
            background-color: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .panel { 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 10px; 
            max-width: 600px; 
            margin: 0 auto 10px auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        button { 
            background-color: #555; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: not-allowed; 
            font-weight: bold;
        }
        button.active { 
            background-color: #4CAF50; 
            cursor: pointer; 
        }
        /* 讓視訊與畫布完美重疊顯示 */
        .video-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }
        video, canvas { 
            width: 100%; 
            border: 2px solid #4CAF50; 
            border-radius: 8px; 
            background-color: #000; 
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .info { font-size: 24px; color: #ffeb3b; margin: 8px 0; }
        .log { font-family: monospace; font-size: 13px; color: #00e676; background: #000; padding: 8px; border-radius: 5px; margin-top: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2>AI 智慧物件辨識與測距</h2>
    <div class="panel">
        <p id="status" style="color: #ffeb3b; margin: 5px 0;">正在下載並初始化 AI 模型 (約 5MB)...</p>
        <div class="info">目標距離: <span id="distance">-</span> cm</div>
        <button id="startBtn" onclick="startSystem()" disabled>等待 AI 載入...</button>
        <div class="log" id="debugLog">系統狀態: 載入中</div>
    </div>
    
    <div class="video-container">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <script>
        const KNOWN_WIDTH = 5.0; // 目標物體真實寬度 (公分，可依你測試的物品調整，例如球約 5cm)
        let FOCAL_LENGTH = 400;  // 焦距常數
        
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let model = undefined;
        let isDetecting = false;

        function log(msg) {
            document.getElementById('debugLog').innerHTML = msg;
        }

        // 1. 自動預先載入 AI 模型
        cocoSsd.load().then(function (loadedModel) {
            model = loadedModel;
            document.getElementById('status').innerText = 'AI 模型載入完成！';
            document.getElementById('status').style.color = '#4CAF50';
            
            let btn = document.getElementById('startBtn');
            btn.innerText = '【 點擊啟動相機與 AI 辨識 】';
            btn.className = 'active';
            btn.disabled = false;
            log('系統狀態: 準備就緒，請點擊按鈕');
        }).catch(err => {
            document.getElementById('status').innerText = 'AI 模型載入失敗 (請檢查網路)';
            document.getElementById('status').style.color = '#F44336';
            log('錯誤: ' + err.message);
        });

        // 2. 啟動相機
        function startSystem() {
            if (!model) {
                alert('AI 模型尚未準備好');
                return;
            }

            document.getElementById('status').innerText = '正在要求相機權限...';
            document.getElementById('startBtn').disabled = true;

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    isDetecting = true;
                    
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('status').innerText = 'AI 視覺運作中';
                    log('狀態: 相機與 AI 辨識迴圈已啟動');
                    
                    // 開始 AI 物件偵測無限迴圈
                    detectFrame();
                });
            })
            .catch(function(err) {
                document.getElementById('status').innerText = '相機啟動失敗: ' + err.message;
                document.getElementById('status').style.color = '#F44336';
                document.getElementById('startBtn').disabled = false;
            });
        }

        // 3. AI 即時辨識與測距迴圈
        async function detectFrame() {
            if (!isDetecting) return;

            try {
                // 讓 AI 模型去掃描當前視訊畫面
                let predictions = await model.detect(video);

                // 清除上一幀的畫布
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (predictions.length > 0) {
                    // 找出信心水準最高（最準確）的辨識結果
                    let bestObj = predictions[0];
                    let [x, y, width, height] = bestObj.bbox;
                    let label = bestObj.class;
                    let score = Math.round(bestObj.score * 100);

                    // 計算距離 (利用框的像素寬度)
                    let distance = (KNOWN_WIDTH * FOCAL_LENGTH) / width;
                    document.getElementById('distance').innerText = distance.toFixed(1);

                    log(`🎯 鎖定物體: <b>${label}</b> (${score}%)<br>` +
                        `- 像素寬度: ${Math.round(width)} px<br>` +
                        `- 計算距離: ${distance.toFixed(1)} cm`);

                    // 畫出 AI 的智慧邊界框
                    ctx.strokeStyle = '#00FF00';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, width, height);

                    // 畫出標籤背景與文字
                    ctx.fillStyle = '#00FF00';
                    ctx.font = '18px sans-serif';
                    ctx.fillText(`${label} ${score}% | ${distance.toFixed(1)}cm`, x, y > 20 ? y - 8 : 15);

                } else {
                    document.getElementById('distance').innerText = "-";
                    log('🔍 畫面中未偵測到已知物體 (尋找中...)');
                }

            } catch (err) {
                console.error("AI 辨識錯誤: ", err);
            }

            // 進入下一影格
            requestAnimationFrame(detectFrame);
        }
    </script>
</body>
</html>
