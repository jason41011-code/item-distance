<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>35mm 白球視覺測距 - 精準調校版</title>
    <style>
        body { 
            margin: 0; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .box { 
            background: #222; 
            padding: 12px; 
            border-radius: 10px; 
            max-width: 600px; 
            margin: 0 auto 10px auto; 
        }
        button { 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        /* 讓畫布直接顯示出來，你可以在上面看到追蹤框與距離 */
        canvas { 
            width: 100%; 
            max-width: 600px; 
            border: 2px solid #4CAF50; 
            border-radius: 8px; 
            background-color: #000; 
        }
        video { display: none; }
        .info { font-size: 22px; color: #ffeb3b; margin: 8px 0; }
    </style>
</head>
<body>
    <h2>35mm 白球距離精準調校</h2>
    <div class="box">
        <button id="startBtn" onclick="initCamera()">【 點擊啟動視覺測距 】</button>
        <div class="info">即時距離: <span id="distance">-</span> cm</div>
        <p id="status" style="font-size: 14px; color: #888; margin: 5px 0;">狀態: 等待啟動相機</p>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>
    <canvas id="canvasOutput"></canvas>

    <script>
        // === 核心物理參數 ===
        const KNOWN_WIDTH = 3.5; // 小白球真實直徑 3.5 公分
        let FOCAL_LENGTH = 350;  // 初始焦距常數 (稍後可透過 30cm 距離手動調整)
        
        let video = document.getElementById('videoInput');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d', { willReadFrequently: true });
        let isRunning = false;

        function initCamera() {
            document.getElementById('status').innerText = '狀態: 正在取得相機權限...';
            
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } }, 
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    // 設定輕量解析度確保手機流暢
                    canvas.width = 320;
                    canvas.height = 240;
                    isRunning = true;
                    
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('status').innerText = '狀態: 視覺運作中 (請將 35mm 白球放入鏡頭)';
                    requestAnimationFrame(processFrame);
                });
            })
            .catch(function(err) {
                document.getElementById('status').innerText = '錯誤: 無法啟動相機 -> ' + err.message;
            });
        }

        function processFrame() {
            if (!isRunning) return;

            // 1. 將相機畫面畫到 Canvas 上
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let pixels = frameData.data;

            let minX = canvas.width, maxX = 0;
            let minY = canvas.height, maxY = 0;
            let whitePixelCount = 0;

            // 2. 掃描畫面尋找白色物體 (高亮度、低飽和度)
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    let idx = (y * canvas.width + x) * 4;
                    let r = pixels[idx];
                    let g = pixels[idx + 1];
                    let b = pixels[idx + 2];

                    // 白球判定條件：RGB 皆大於 190，且數值接近
                    if (r > 190 && g > 190 && b > 190 && Math.abs(r - g) < 20 && Math.abs(g - b) < 20) {
                        whitePixelCount++;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            let distElem = document.getElementById('distance');
            let statusElem = document.getElementById('status');

            // 3. 如果白色像素點足夠多，且寬高合理，判定為目標白球
            if (whitePixelCount > 40) {
                let pixelWidth = maxX - minX;
                let pixelHeight = maxY - minY;
                
                // 確保抓到的不是一整片牆壁（限制最大與最小像素寬度）
                if (pixelWidth > 10 && pixelWidth < 250) {
                    // 計算距離公式：(真實寬度 × 焦距) ÷ 畫面像素寬度
                    let distance = (KNOWN_WIDTH * FOCAL_LENGTH) / pixelWidth;
                    distElem.innerText = distance.toFixed(1);
                    statusElem.innerText = `狀態: 🎯 鎖定白球 | 像素寬度: ${pixelWidth}px`;

                    // 4. 直接在畫面上畫出綠色追蹤方框與中心點
                    ctx.beginPath();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#00FF00'; // 綠色框
                    ctx.rect(minX, minY, pixelWidth, pixelHeight);
                    ctx.stroke();

                    // 畫出中心十字
                    let cx = (minX + maxX) / 2;
                    let cy = (minY + maxY) / 2;
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(cx - 3, cy - 3, 6, 6);

                    // 在框上方印出距離文字
                    ctx.fillStyle = '#00FF00';
                    ctx.font = '16px sans-serif';
                    ctx.fillText(distance.toFixed(1) + ' cm', minX, Math.max(15, minY - 5));

                } else {
                    distElem.innerText = "-";
                    statusElem.innerText = "狀態: 尋找中 (白球過近或過遠)";
                }
            } else {
                distElem.innerText = "-";
                statusElem.innerText = "狀態: 尋找白球中... (請將 35mm 小白球靠近鏡頭)";
            }

            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
