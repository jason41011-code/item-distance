<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>相機直接測試版</title>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
    <style>
        body { 
            margin: 0; 
            text-align: center; 
            background-color: #1a1a1a; 
            color: white; 
            font-family: sans-serif; 
            padding: 10px;
        }
        .panel { 
            background: #2a2a2a; 
            padding: 15px; 
            border-radius: 10px; 
            max-width: 600px; 
            margin: 0 auto 10px auto; 
        }
        button { 
            background-color: #e91e63; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 10px; 
            font-weight: bold;
        }
        video { width: 100%; max-width: 600px; border: 2px solid #e91e63; border-radius: 8px; background-color: #000; }
    </style>
</head>
<body>
    <h2>相機強制測試</h2>
    <div class="panel">
        <p>狀態: <span id="status" style="color: #FFEB3B;">請確保是用 Chrome / Safari 開啟</span></p>
        <button id="startBtn" onclick="forceStartCamera()">【點這裡強制開啟相機】</button>
    </div>
    
    <video id="videoInput" autoplay playsinline muted></video>

    <script>
        let video = document.getElementById('videoInput');

        function forceStartCamera() {
            document.getElementById('status').innerText = '正在要求相機權限...';
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(function(stream) {
                video.srcObject = stream;
                video.play();
                document.getElementById('status').innerText = '相機啟動成功！畫面已出現';
                document.getElementById('status').style.color = '#4CAF50';
                document.getElementById('startBtn').style.display = 'none'; // 成功後藏按鈕
            })
            .catch(function(err) {
                console.error(err);
                // 如果後置鏡頭失敗，改抓一般鏡頭
                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    document.getElementById('status').innerText = '相機啟動成功 (預設鏡頭)';
                    document.getElementById('status').style.color = '#4CAF50';
                    document.getElementById('startBtn').style.display = 'none';
                })
                .catch(function(e) {
                    document.getElementById('status').innerText = '失敗: ' + e.message;
                    document.getElementById('status').style.color = '#F44336';
                });
            });
        }
    </script>
</body>
</html>
